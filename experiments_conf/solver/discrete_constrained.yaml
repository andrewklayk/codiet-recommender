name: discrete_constrained
model_name: DISC
custom_objective: none
#N_SELECT_FEATURES: 5
n_runs: 5
recalculate_dag: false

#feature_selector: null   # skip SFS — train once on all features with ALM

# neural network architecture
# backbone: mlp | deep_mlp | onehot_mlp | embedding_mlp | transformer
network: mlp
hidden_dim: 64
n_layers: 2
# extra knobs used by some backbones:
# dropout: 0.1        # deep_mlp / onehot_mlp / embedding_mlp / transformer
# emb_dim: 8          # embedding_mlp
# d_model: 32         # transformer
# n_heads: 4          # transformer
# dim_feedforward: 64 # transformer

# training
n_epochs: 60
batch_size: 32
learning_rate: 0.001
# opt-in: fraction of the training data held out (once, before fitting)
# purely for best_epoch_ selection -- see CausalConstrainedPredictor.fit's
# docstring (val_fraction) and CONSTRAINTS.md sec. 6. 0.0 (default) keeps
# selecting on the training split itself, as before.
val_fraction: 0.

# interaction-graph baselines: restrict the model's input features.
#   restrict_to_parents:        keep only the target's direct causes (parents)
#   restrict_to_markov_blanket: keep parents + children + co-parents
# markov_blanket takes precedence if both are true. Combines with use_alm.
restrict_to_parents: false
restrict_to_markov_blanket: false

# constrained training via humancompatible/train (pip install humancompatible-train)
use_alm: true
alm_lr: 5.0
alm_penalty: 1.0     # >0 auto-selects the ALM package's "hpr" augmentation
                     # instead of the plain unaugmented Lagrangian -- see
                     # CONSTRAINTS.md sec. 5 for why: the plain update has no
                     # fixed point once a constraint's achievable violation
                     # floor sits above alm_slack, so its dual ratchets to the
                     # ALM clamp and the penalty term swamps the loss.
alm_slack: 0.01
alm_momentum: 0.
# opt-in: replace the single global alm_slack above with a per-triplet slack
# calibrated from each triplet's achievable (true-label) violation floor --
# see CausalConstrainedPredictor.fit's docstring and calibrate_slacks.ipynb.
calibrate_slacks: true
slack_calibration_fraction: 1.2
alm_selection_weight: 0.0


# Moreau-envelope smoothing: the ALM optimizer wraps Adam in the SAME
# MoreauEnvelope as the *_me sibling, so uncon_ME is a valid control for this
# arm. These MUST stay equal to the *_me config's values.
moreau_mu: 2.0
moreau_beta: 0.5

# debugging
debug: false